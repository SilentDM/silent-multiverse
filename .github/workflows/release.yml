# As releases são geradas no PC (python build.py) e publicadas à mão no GitHub, por isso este
# workflow NÃO reage a tags. Rodado manualmente (Actions → Release → Run workflow), ele roda os
# testes no Windows e gera o .zip como artefato, sem criar release.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
          SILENT_TEST_TIMEOUT: "120"
        run: python -X faulthandler -m unittest discover -s tests -t . -v

      - name: Build executable
        run: python build.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilentMultiverse-windows
          path: dist/*.zip

